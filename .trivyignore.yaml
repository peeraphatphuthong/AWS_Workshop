# Accepted Trivy IaC findings (risk acceptance). Rules for this file:
#   - every entry is scoped to specific paths, has a statement (why), and an expiry date
#   - expired entries make the scan fail again -> forces a re-review
# Format: https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml
misconfigurations:
  - id: AWS-0132
    paths:
      - "bootstrap/state_bucket.tf"
    statement: >-
      State bucket uses SSE-S3 (AES-256, AWS-managed keys). A customer-managed KMS key adds key-policy
      control and CloudTrail decrypt auditing at ~$1/month + API costs; access is already restricted by
      IAM, public access block and a TLS-only bucket policy. Revisit for production / multi-team use.
    expired_at: 2027-05-08

  - id: AWS-0104
    paths:
      - "modules/network/security_groups.tf"
      - "modules/fargate/network.tf"
    statement: >-
      Web host / Fargate task egress on 80/443 to 0.0.0.0/0 is required: it reaches ECR, SSM, Secrets Manager, OS
      package mirrors, Docker Hub and GitHub without NAT/VPC endpoints. Only 80/443 are open (plus 3306
      to the DB SG; Fargate tasks: 443 only). Production alternative: interface VPC endpoints (~$7/month each) + S3 gateway
      endpoint + an egress proxy / Network Firewall allow-list.
    expired_at: 2027-05-08

  - id: AWS-0095
    paths:
      - "bootstrap/alerts.tf"
    statement: >-
      Alert SNS topic is not encrypted at rest. CloudWatch alarms cannot publish to a topic encrypted
      with the AWS-managed aws/sns key, so encryption would need a customer-managed KMS key (~$1/month).
      Messages contain only alarm names/metric values (no secrets or personal data); publish is limited
      to this account's CloudWatch/Budgets by the topic policy. Use a CMK in production.
    expired_at: 2027-05-08

  - id: AWS-0053
    paths:
      - "modules/web/compute.tf"
    statement: >-
      The ALB is internet-facing on purpose: it is the public entry point of a public web app. It is the
      only internet-reachable component; instances accept traffic from the ALB security group only.
    expired_at: 2027-05-08

  - id: AWS-0054
    paths:
      - "modules/web/compute.tf"
      - "modules/fargate/network.tf"
    statement: >-
      HTTP-only listeners (port 80 EC2, port 8080 Fargate comparison) because the sandbox has no domain to issue an ACM certificate for. The app serves
      no credentials or personal data. Production requires an HTTPS listener (ACM cert, TLS 1.2+ policy)
      with an HTTP->HTTPS redirect. Short expiry: CRITICAL finding, re-review in 3 months.
    expired_at: 2027-02-09
