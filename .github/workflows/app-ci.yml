name: app-ci

# PR:   test → build → Trivy scan          (no AWS credentials)
# main: test → build → scan → push to ECR  (tag = git SHA, immutable)
on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR_REPOSITORY: aws-workshop/retail-health
  # Pinned by tag AND digest: the digest can't be moved even if the tag is re-pushed.
  # Keep the scanner current — an outdated 0.58.1 missed CVE-2026-4738 (see docs/phase-3-app-ecr.md).
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm test

  build-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load into local Docker for scanning)
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: retail-health:${{ github.sha }}
          build-args: |
            APP_VERSION=0.1.0
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -e IMDS_DISABLED=true -p 3000:3000 retail-health:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/status | tee status.json
          grep -q '"gitSha":"${{ github.sha }}"' status.json
          # The app runs as "node": it must be able to read the RDS CA bundle (regression test for EACCES).
          docker exec smoke head -c 27 /app/certs/rds-global-bundle.pem | grep -q 'BEGIN CERTIFICATE'
          docker rm -f smoke

      # The real nginx.conf in front of the real image: config is valid, proxying works and the per-IP
      # rate limit returns 429 for a burst (regression test for the 2026-11-10 scanner incident).
      - name: NGINX config + rate limit test
        run: |
          NGINX_IMAGE=$(grep -oE 'image: nginx:[^ ]+' app/docker-compose.yml | cut -d' ' -f2)
          docker network create rh
          docker run -d --name app --network rh -e IMDS_DISABLED=true retail-health:${{ github.sha }}
          docker run -d --name proxy --network rh -p 8081:80 \
            -v "$PWD/app/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" "$NGINX_IMAGE"
          docker exec proxy nginx -t
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8081/healthz && break; sleep 1; done
          sleep 1 # let the limiter's bucket refill after the readiness probes
          codes=$(for i in $(seq 1 100); do curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8081/healthz & done; wait)
          n200=$(grep -c '^200$' <<< "$codes" || true)
          n429=$(grep -c '^429$' <<< "$codes" || true)
          echo "100 concurrent requests from one IP: $n200 x 200, $n429 x 429"
          docker logs proxy 2>&1 | tail -n 3
          [ "$n200" -ge 40 ] && [ "$n429" -ge 1 ]
          docker rm -f proxy app && docker network rm rh

      - name: Trivy — report all HIGH/CRITICAL (including unfixed)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              --no-progress \
              retail-health:${{ github.sha }}

      - name: Trivy — fail on fixable HIGH/CRITICAL vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              retail-health:${{ github.sha }}

  push:
    needs: build-scan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: aws-dev # deploy user; environment only allows the main branch
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image name
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Rebuild is near-instant thanks to the GitHub Actions layer cache from build-scan.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            APP_VERSION=0.1.0
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo '```'
            echo "${{ steps.meta.outputs.image }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Continuous deployment to dev (Phase 8.3: Auto Scaling group behind an ALB):
  #   record current tag -> set desired tag in Parameter Store -> SSM Run Command deploy-app on EVERY
  #   instance of the ASG, one at a time -> smoke test through the ALB -> on failure, roll back.
  #   Instances launched later (scale-out, refresh, morning start) read the tag at boot.
  #   Phase 8.4: then the same image goes to the ECS Fargate service (new task definition revision).
  deploy:
    needs: push
    runs-on: ubuntu-latest
    environment:
      name: aws-dev
      url: ${{ steps.target.outputs.url }}
    env:
      TAG_PARAM: /retail-health/dev/app/image-tag
      ASG_NAME: aws-workshop-dev-web
      ALB_NAME: aws-workshop-dev-alb
      ECS_CLUSTER: aws-workshop-dev
      ECS_SERVICE: aws-workshop-dev-app
      NEW_TAG: ${{ github.sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve targets and URL
        id: target
        run: |
          IDS=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' --output text)
          DNS=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].DNSName' --output text)
          PREV=$(aws ssm get-parameter --name "$TAG_PARAM" --query Parameter.Value --output text)
          echo "instance_ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "url=http://$DNS" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "Deploying ${NEW_TAG::7} to [${IDS:-none}] behind $DNS (previous ${PREV::7})"

      - name: Set desired version
        run: aws ssm put-parameter --name "$TAG_PARAM" --value "$NEW_TAG" --overwrite > /dev/null

      - name: Nothing running (night schedule) - version is set for the next boot
        if: steps.target.outputs.instance_ids == ''
        run: |
          echo "::notice::ASG $ASG_NAME has no InService instances (scaled to 0). ${NEW_TAG::7} is the desired version; instances will run it when they start."
          echo "### Desired version set to \`${NEW_TAG::7}\` (no instances running) ⏸" >> "$GITHUB_STEP_SUMMARY"

      - name: Run deploy-app via SSM (one instance at a time)
        if: steps.target.outputs.instance_ids != ''
        env:
          IDS: ${{ steps.target.outputs.instance_ids }}
        run: |
          set -euo pipefail
          for id in $IDS; do
            cmd=$(aws ssm send-command --instance-ids "$id" \
              --document-name AWS-RunShellScript \
              --comment "deploy ${NEW_TAG::7} by ${GITHUB_ACTOR} run ${GITHUB_RUN_ID}" \
              --parameters 'commands=["/usr/local/bin/deploy-app"]' \
              --timeout-seconds 600 --query Command.CommandId --output text)
            status=Pending
            for _ in $(seq 1 60); do
              status=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$id" \
                --query Status --output text 2>/dev/null || echo Pending)
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
              sleep 5
            done
            aws ssm get-command-invocation --command-id "$cmd" --instance-id "$id" \
              --query StandardOutputContent --output text | tail -n 5
            echo "$id: $status"
            if [ "$status" != "Success" ]; then exit 1; fi
          done

      - name: Smoke test through the load balancer
        if: steps.target.outputs.instance_ids != ''
        env:
          URL: ${{ steps.target.outputs.url }}
          IDS: ${{ steps.target.outputs.instance_ids }}
        run: |
          # Several requests: with 2+ instances the ALB spreads them, so every instance gets checked.
          n=$(( $(echo $IDS | wc -w) * 3 ))
          for i in $(seq 1 "$n"); do
            ok=false
            for _ in $(seq 1 12); do
              if curl -fsS "$URL/api/status" -o status.json; then ok=true; break; fi
              sleep 5
            done
            $ok || { echo "::error::$URL not reachable"; exit 1; }
            jq -c '{sha: .app.gitSha[0:7], instance: .ec2.instanceId, db: .db.status}' status.json
            jq -e --arg sha "$NEW_TAG" '.app.gitSha == $sha' status.json > /dev/null \
              || { echo "::error::an instance is not running $NEW_TAG"; exit 1; }
            jq -e '.db.status == "ok"' status.json > /dev/null \
              || { echo "::error::database check failed after deploy"; exit 1; }
          done
          echo "### Deployed \`${NEW_TAG::7}\` to $URL ✅" >> "$GITHUB_STEP_SUMMARY"

      # ---- Phase 8.4: the same image on ECS Fargate (same ALB, port 8080) ----
      # Deploy = register a new task definition revision (copy of the current one, new image) and point
      # the service at it. ECS does the rolling replacement; its circuit breaker rolls back by itself.
      - name: Fargate - register new task definition and update the service
        id: ecs
        run: |
          set -euo pipefail
          svc=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[?status==`ACTIVE`]|[0].[taskDefinition,desiredCount]' --output text 2>/dev/null || true)
          if [ -z "$svc" ] || [ "$svc" = "None" ]; then
            echo "::notice::ECS service $ECS_CLUSTER/$ECS_SERVICE not found - skipping the Fargate deploy."
            exit 0
          fi
          read -r CUR_TD DESIRED <<< "$svc"
          aws ecs describe-task-definition --task-definition "$CUR_TD" --include TAGS \
            --query '{td: taskDefinition, tags: tags}' > current.json
          # Keep everything (CPU, secrets, health check, tags...) and change only the app image tag;
          # drop the read-only fields that describe returns but register does not accept.
          jq --arg tag "$NEW_TAG" '
            .td
            | .containerDefinitions |= map(if .name == "app" then .image = (.image | sub(":[^:/]+$"; "")) + ":" + $tag else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                  .registeredAt, .registeredBy, .deregisteredAt)
          ' current.json > next.json
          tags=$(jq -c '.tags // []' current.json)
          if [ "$tags" != "[]" ]; then jq --argjson t "$tags" '. + {tags: $t}' next.json > next-tagged.json && mv next-tagged.json next.json; fi
          NEW_TD=$(aws ecs register-task-definition --cli-input-json file://next.json \
            --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TD" > /dev/null
          {
            echo "previous_td=$CUR_TD"
            echo "new_td=$NEW_TD"
            echo "desired=$DESIRED"
          } >> "$GITHUB_OUTPUT"
          echo "Fargate: ${CUR_TD##*/} -> ${NEW_TD##*/} (desired tasks: $DESIRED)"

      - name: Fargate - wait for the rollout and smoke test port 8080
        if: steps.ecs.outputs.new_td != '' && steps.ecs.outputs.desired != '0'
        env:
          NEW_TD: ${{ steps.ecs.outputs.new_td }}
          URL: ${{ steps.target.outputs.url }}:8080
        run: |
          set -euo pipefail
          state=""
          for _ in $(seq 1 60); do
            read -r state td <<< "$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].deployments[?status==`PRIMARY`]|[0].[rolloutState,taskDefinition]' --output text)"
            if [ "$td" != "$NEW_TD" ]; then
              echo "::error::ECS circuit breaker rolled the service back to ${td##*/}"; exit 1
            fi
            case "$state" in COMPLETED) break ;; FAILED) echo "::error::ECS rollout failed"; exit 1 ;; esac
            sleep 10
          done
          [ "$state" = "COMPLETED" ] || { echo "::error::ECS rollout did not finish in 10 minutes"; exit 1; }
          for _ in 1 2 3; do
            curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "$URL/api/status" -o status.json
            jq -c '{sha: .app.gitSha[0:7], db: .db.status}' status.json
            jq -e --arg sha "$NEW_TAG" '.app.gitSha == $sha and .db.status == "ok"' status.json > /dev/null \
              || { echo "::error::Fargate is not serving $NEW_TAG with a working DB"; exit 1; }
          done
          echo "### Fargate: deployed \`${NEW_TAG::7}\` to $URL ✅" >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back to previous version
        if: failure() && steps.target.outputs.previous_tag != ''
        env:
          IDS: ${{ steps.target.outputs.instance_ids }}
          PREV: ${{ steps.target.outputs.previous_tag }}
          PREV_TD: ${{ steps.ecs.outputs.previous_td }}
        run: |
          echo "::warning::Deploy failed - rolling back to ${PREV::7}"
          aws ssm put-parameter --name "$TAG_PARAM" --value "$PREV" --overwrite > /dev/null
          if [ -n "$PREV_TD" ]; then
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
              --task-definition "$PREV_TD" > /dev/null
            echo "Fargate service pointed back to ${PREV_TD##*/}"
          fi
          if [ -n "$IDS" ]; then
            # shellcheck disable=SC2086 # one argument per instance ID
            aws ssm send-command --instance-ids $IDS --document-name AWS-RunShellScript \
              --comment "rollback to ${PREV::7}" --parameters 'commands=["/usr/local/bin/deploy-app"]' \
              --query Command.CommandId --output text
          fi
          echo "### ❌ Deploy of \`${NEW_TAG::7}\` failed - rolled back to \`${PREV::7}\`" >> "$GITHUB_STEP_SUMMARY"
