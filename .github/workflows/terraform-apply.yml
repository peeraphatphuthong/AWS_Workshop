name: terraform-apply

# On merge to main:
#   plan  : saved plan with the read-only user, shown in the job summary
#   apply : waits for a human approval (environment aws-dev-infra), then applies EXACTLY that plan.
# Terraform refuses to apply a saved plan if the state changed in between ("stale plan").
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "modules/**"
      - "app/docker-compose.yml"
      - "app/nginx/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two applies at once, and never cancel one that's running.
concurrency:
  group: terraform-apply-infra
  cancel-in-progress: false

env:
  TF_VERSION: "~1.17"
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: aws-plan
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init -input=false

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          cat plan.log
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; else echo "has_changes=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### Terraform plan for \`infra\` @ ${GITHUB_SHA::7}"
            echo '```'
            terraform show -no-color tfplan | grep -E '^\s+# .+ (will be|must be)' | sed 's/^ *//' || true
            grep -E '^Plan:|^No changes' plan.log | tail -n1 || true
            echo '```'
            if [ "$code" -eq 2 ]; then
              echo "➡️ Approve the **apply** job (environment \`aws-dev-infra\`) to roll this out."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-infra-${{ github.sha }}
          # .build = Lambda zips created by archive_file during plan; apply needs the same files.
          path: |
            infra/tfplan
            infra/.build/
          include-hidden-files: true
          retention-days: 1

  apply:
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: aws-dev-infra # required reviewer + main only
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-infra-${{ github.sha }}
          path: infra

      - run: terraform init -input=false

      - name: terraform apply (saved plan)
        run: terraform apply -input=false -no-color -lock-timeout=120s tfplan
