name: aws-access-check

# Proves the least-privilege split of the two CI identities:
#   plan user  (env aws-plan) : can read, cannot write, cannot read secret values
#   deploy user(env aws-dev)  : not testable from a PR at all — its environment only allows `main`.
#                               That restriction is itself the control being demonstrated.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bootstrap/**"
      - ".github/workflows/aws-access-check.yml"

permissions:
  contents: read

jobs:
  plan-user:
    runs-on: ubuntu-latest
    environment: aws-plan
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity --query Arn --output text

      - name: Can read state and describe resources
        run: |
          aws s3 ls "s3://${{ vars.TF_STATE_BUCKET }}/" --recursive
          aws ec2 describe-vpcs --filters Name=tag:Project,Values=aws-workshop --query 'Vpcs[].VpcId' --output text

      - name: Is BLOCKED from overwriting state
        run: |
          echo test > probe.txt
          if aws s3 cp probe.txt "s3://${{ vars.TF_STATE_BUCKET }}/infra/terraform.tfstate" > /dev/null 2>&1; then
            echo "::error::plan user could overwrite state"; exit 1
          fi
          echo "OK: state overwrite denied"

      - name: Is BLOCKED from reading secret values
        run: |
          if aws secretsmanager get-secret-value --secret-id /retail-health/dev/db/app > /dev/null 2>&1; then
            echo "::error::plan user can read secret values"; exit 1
          fi
          echo "OK: GetSecretValue denied"

      - name: Is BLOCKED from creating resources
        run: |
          if aws ec2 create-security-group --group-name ci-probe --description probe --dry-run 2>&1 | grep -q DryRunOperation; then
            echo "::error::plan user could create a security group"; exit 1
          fi
          echo "OK: write denied"
