name: terraform-ci

# Pull-request checks for infrastructure code:
#   static   : fmt, validate, tflint            (no AWS access)
#   security : Trivy IaC misconfiguration scan  (no AWS access)
#   plan     : real `terraform plan` with the READ-ONLY CI user, posted as a PR comment
on:
  pull_request:
    paths:
      - "infra/**"
      - "modules/**"
      - "bootstrap/**"
      - "app/docker-compose.yml" # embedded in EC2 user_data
      - "app/nginx/**"           # embedded in EC2 user_data
      - ".tflint.hcl"
      - ".trivyignore.yaml"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "~1.17"
  TF_IN_AUTOMATION: "true"
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, infra]
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform fmt (modules)
        if: matrix.stack == 'infra'
        run: terraform fmt -check -recursive -diff ../modules

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the AWS ruleset
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Trivy IaC scan (Terraform + Dockerfile)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml \
            --exit-code 1 \
            .

  plan:
    needs: static
    runs-on: ubuntu-latest
    environment: aws-plan # read-only IAM user
    permissions:
      contents: read
      pull-requests: write # to post the plan comment
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          cat plan.log
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = no changes, 2 = changes, 1 = error
          if [ "$code" -eq 1 ]; then exit 1; fi
          terraform show -no-color tfplan > plan.txt
          grep -E '^\s+# .+ (will be|must be)' plan.txt | sed 's/^ *//' > changes.txt || true
          grep -E '^Plan:|^No changes' plan.log | tail -n1 > summary.txt || true

      - name: Comment plan on PR
        if: always() && steps.plan.outputs.exitcode != ''
        uses: actions/github-script@v7
        env:
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const read = (f) => (fs.existsSync(`infra/${f}`) ? fs.readFileSync(`infra/${f}`, 'utf8') : '');
            const code = process.env.EXITCODE;
            const status = code === '0' ? '✅ No changes' : code === '2' ? '📝 Changes' : '❌ Plan failed';
            const max = 60000;
            let full = read('plan.txt') || read('plan.log');
            if (full.length > max) full = full.slice(0, max) + '\n... (truncated, see workflow logs)';
            const marker = '<!-- terraform-plan:infra -->';
            const body = [
              marker,
              `### Terraform plan — \`infra\` — ${status}`,
              read('summary.txt').trim() ? `**${read('summary.txt').trim()}**` : '',
              read('changes.txt').trim() ? '```\n' + read('changes.txt').trim() + '\n```' : '',
              '<details><summary>Full plan</summary>\n\n```hcl\n' + full + '\n```\n</details>',
              `\n_Commit ${context.sha.slice(0, 7)} · run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) · read-only plan user_`,
            ].filter(Boolean).join('\n\n');
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
