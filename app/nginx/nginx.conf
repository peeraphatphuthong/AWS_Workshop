# NGINX as a reverse proxy in front of the Node.js app.
# Why a proxy at all? TLS termination (later), request buffering/slow-client protection,
# gzip, security headers, access logs, and one stable entry point while app containers change.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;   # don't advertise the NGINX version

  # ---- Real client IP (incident 2026-11-10: logs only showed the ALB's IP, so the scanner was untraceable).
  # Trust X-Forwarded-For only when the connection comes from inside the VPC (ALB nodes), and take the
  # right-most untrusted address: the ALB appends the real client IP, so a client-supplied XFF can't spoof it.
  set_real_ip_from 10.0.0.0/8;
  real_ip_header   X-Forwarded-For;
  real_ip_recursive on;

  # ---- Rate limit per client IP (same incident: ~480 req/s from one scanner made the app stop accepting
  # connections and NGINX returned 504 for ~40 s). Excess requests get 429 here and never reach Node.
  # 20 req/s steady + bursts of 40 is far above what a person (or the synthetic check) ever sends.
  limit_req_zone   $binary_remote_addr zone=per_ip:10m rate=20r/s;
  limit_req_status 429;
  limit_req_log_level warn;

  # JSON access log -> easy to parse in CloudWatch Logs Insights.
  # "remote" is the real client IP (real_ip above); "peer" is the TCP peer (ALB node); "xff" the raw header.
  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","peer":"$realip_remote_addr",'
                              '"xff":"$http_x_forwarded_for","method":"$request_method",'
                              '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                              '"rt":$request_time,"upstream_rt":"$upstream_response_time","ua":"$http_user_agent"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript;
  gzip_min_length 1024;

  upstream app {
    server app:3000;   # Docker Compose service name, resolved by Docker's embedded DNS
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # NGINX's own health endpoint (does not touch the app).
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      limit_req zone=per_ip burst=40 nodelay;

      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
    }
  }
}
